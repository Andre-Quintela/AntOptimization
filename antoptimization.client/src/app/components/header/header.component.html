<header class="app-header">
  <div class="header-content">
    <button class="btn-back" *ngIf="showBackButton" (click)="onBackClick()" title="Voltar">
      <i class="bi bi-arrow-left"></i>
    </button>
    <div class="header-brand">
      <i class="bi header-logo" [ngClass]="iconClass"></i>
      <div>
        <h1>{{ title }}</h1>
        <p class="header-subtitle">{{ subtitle }}</p>
      </div>
    </div>
    <div class="header-made-by" *ngIf="authorCredit">
      <span>feito por</span>
      <strong>{{ authorCredit }}</strong>
    </div>
  </div>
</header>
